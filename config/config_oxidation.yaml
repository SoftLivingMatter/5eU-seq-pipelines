workdir: "/your/directory/here"

outputs:
  # - end_cov
  # - cleavage
  # - region_count
  # - methyl
  # - freebayes
  - mpileup

min_mean_depth: 20  # minimum mean depth across samples to report a site

# The directory to store log files for specific jobs
log_dir: "logs"
runtime: # default is short
  human: "long"  # or long

junctions:  # paths to saf files for featurecounts.  Key is used in output name
  human: 
    allJunctions3:    /path/to/assets/allJunctions3.saf
    extraJunctions3b: /path/to/assets/extraJunctions3b.saf
    extraJunctions3:  /path/to/assets/extraJunctions3.saf
    5.8S: /path/to/58S.saf
    ITS1: /path/to/ITS1.saf

bedtool_junctions:  # paths to saf files for featurecounts.  Key is used in output name
  human: 
    allJunctions3: /path/to/assets/allJunctions3.bed

# used to parse a sample and time from sample name
cleavage_sample_regex: "{sample}_{time}min.*"
# sample is replaced with .*, time with \d+
# sample is expected before time

# given multiple reference directories, how to align each reference
# parallel: use the trimmed fastq files as input for every reference
# sequential: use the unpaired sequences from the previous reference to
# align to the next reference
alignment_strategy: 'parallel'
# The directory where reference genomes are stored.
star_ref_dirs:
  human: "/path/to/STAR/human_rDNA_U13369.1"

# reference files for methyl calling.  Keys must match star reference dirs
# file can be a list of numeric positions, or a csv with position,name columns
# assumes no header lines, e.g. assets/methyl_positions.csv
methyl_positions:
  human: "/path/to/assets/methyl_positions.txt"

# can be relative to workdir or absolute
fastqs: "/your/directory/here/{sample}_R{read}_001.fastq.gz"

trimmomatic_base: "/path/to/Trimmomatic-0.39"

region_count:
  human: '/path/to/assets/allJunctions3.bed'

# freebayes_references:  # only if different from the STAR reference (<star dir>.fa)
  # human: "/path/to/reference.fa"

paths:
  slurm_output: "logs/slurm"
  trimmed: "trim/{sample}-read-{read}-{trim}.fastq.gz"
  mapped: "mapped/{reference}/{sample}"  # will have suffixes added
  end_cov_sam: "end_cov/{reference}/{sample}.{reads}.sam"
  end_cov: "end_cov/{reference}/{sample}.{reads}.bedgraph"
  scores: "scores/{reference}_{method}.csv"
  feature_counts: "feature_counts/{reference}/{junction}_{overlap}.txt"
  overlaps: "overlaps/{reference}/{junction}_{filetype}.txt"

  bedtools_sample_bed: "bedtools_counts/{reference}/beds/{sample}.bed"
  bedtools_counts: "bedtools_counts/{reference}/counts/{junction}/{sample}.bed"
  bedtools_summary: "bedtools_counts/{reference}/{junction}_summary.tsv"

  region_count: "region_count/{reference}/{sample}.counts"
  region_count_summary: "region_count/{reference}.counts"

  freebayes: "freebayes/{reference}/variants.vcf"

  mpileup: "mpileup/{reference}/{sample}.pileup.gz"
  mpileup_parsed: "mpileup/{reference}/{sample}.tsv"
  mpileup_summary: "mpileup/{reference}/summary.tsv"

  fastqc: "logs/fastqc/{sample}-read-{read}_fastqc.{ext}"
  multiqc: "logs/qc/multiqc_report.html"

containers:
  bedtools: 'docker://quay.io/biocontainers/bedtools:2.24--1'
  samtools: 'docker://biocontainers/samtools:v1.9-4-deb_cv1'
  star: 'docker://quay.io/biocontainers/star:2.7.11a--h0033a41_0'
  freebayes: 'docker://quay.io/biocontainers/freebayes:1.3.10--hbefcdb2_0'
  fastqc: 'docker://quay.io/biocontainers/fastqc:0.12.1--hdfd78af_0'
  multiqc: 'docker://multiqc/multiqc:pdf-dev'
