workdir: "/scratch/gpfs/tcomi/eu_spikein_test" # "/scratch/gpfs/tcomi/eu_test"

outputs:
  - end_cov
  - cleavage
    # - pseudoU
    #- methyl

# The directory to store log files for specific jobs
log_dir: "log"

junctions:  # paths to saf files for featurecounts.  Key is used in output name
  allJunctions3:    /projects/BRANGWYNNE/projects/genomics/primary_data/2023/11_November/20231110_MiseqV3/data/04_end_analysis/subread_junctions/allJunctions3.saf
  extraJunctions3b: /projects/BRANGWYNNE/projects/genomics/primary_data/2023/11_November/20231110_MiseqV3/data/04_end_analysis/subread_junctions/extraJunctions3b.saf
  extraJunctions3:  /projects/BRANGWYNNE/projects/genomics/primary_data/2023/11_November/20231110_MiseqV3/data/04_end_analysis/subread_junctions/extraJunctions3.saf

# used to parse a sample and time from sample name
cleavage_sample_regex: "{sample}_S{time}.*" #"{sample}-15p{time}.*"

# DDX21-KD-15p00p_S7
# { samp }-15p{}.*
# sample is replaced with .*, time with \d+
# sample is expected before time

# The directory where all reference genomes are stored.
star_ref_dirs:
  human: "/projects/BRANGWYNNE/tools/genomics/genomes/STAR/human_custom_transcripts/human_rDNA_U13369.1"
  spikeins: "/projects/BRANGWYNNE/tools/genomics/genomes/STAR/ERCC_spikeins/select-spike-in-sequences"
  # hg38: "/projects/BRANGWYNNE/tools/genomics/genomes/STAR/hg38/GRCh38.p13_STAR"

# reference files for pseudoU calling.  Keys must match star reference dirs
pseudoU_T_positions:
  human: "/home/tcomi/projects/eu_seq/assets/rRNA_T_positions.txt"
pseudoU_pseudoUsites:
  human: "/home/tcomi/projects/eu_seq/assets/pseudoUsites.txt"

# reference files for methyl calling.  Keys must match star reference dirs
methyl_positions:
  human: "/home/tcomi/projects/eu_seq/assets/methyl_positions.txt"

# can be relative to workdir or absolute
fastqs: "/projects/BRANGWYNNE/projects/genomics/primary_data/2025/06_June/SpikeInIVT-5eUtitration/SpikeInTest_fastqs/{sample}_L001_R{read}_001.fastq.gz"
  #fastqs: "/projects/BRANGWYNNE/projects/genomics/primary_data/2023/11_November/20231110_MiseqV3/data/00_raw/{sample}_L001_R{read}_001.fastq.gz"

trimmomatic_base: "/projects/BRANGWYNNE/tools/genomics/software/Trimmomatic/Trimmomatic-0.39"

paths:
  slurm_output: "logs/slurm"
  trimmed: "trim/{sample}-read-{read}-{trim}.fastq.gz"
  mapped: "mapped/{reference}/{sample}"  # will have suffixes added
  end_cov_sam: "end_cov/{reference}/{sample}.{reads}.sam"
  end_cov: "end_cov/{reference}/{sample}.{reads}.bedgraph"
  scores: "scores/{reference}_{method}.csv"
  feature_counts: "feature_counts/{reference}/{junction}_{overlap}.txt"
  overlaps: "overlaps/{reference}/{junction}_{filetype}.txt"

containers:
  bedtools: 'docker://quay.io/biocontainers/bedtools:2.24--1'
  samtools: 'docker://biocontainers/samtools:v1.9-4-deb_cv1'
  star: 'docker://quay.io/biocontainers/star:2.7.11a--h0033a41_0'
